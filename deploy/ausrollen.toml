# Ausrollen auf den Pi mit tools/ausrollen.sh (Ablauf in tools/ausrollen.py, gebaut aus den Teilen des Appkerns:
# appkern.werkzeuge.ausrollen). Rechner, Ordner, Adresse und Namen im Zertifikat gehören dem Haus und stehen nicht im
# Repo: tools/ausrollen.sh holt sie aus der privaten Wahrheit (handbuch ziel radiohub --toml) als Ergänzung.
kennung = "radiohub"
repo = "https://github.com/HalloWelt42/RadioHub.git"
compose = "compose.pi.yml"
# ton: RadioHub nutzt keinen Tondienst der Leitstelle (die Vertonung der Zeitansage fragt es selbst)
ton = false

# Zugänge, die das Ausrollen besorgt (HELF-77, Appkern docs/ZUGAENGE.md): Adresse und App-Schlüssel der Kellerwolke als
# feste Einstellungen in der .env (RADIOHUB_FEST_KELLERWOLKE_ADRESSE und _SCHLUESSEL), solange sie dort fehlen. Der
# Schlüssel gilt für Anmeldung, Ablage und Vertonung; dem Konto gehört RadioHub (nur es meldet sich an, weitere unter
# Einstellungen, Zugang). Name wie der bisherige Zugang (Ordner Apps/RadioHub), sonst entstünde ein leerer Zweig.
[zugaenge]
name = "RadioHub"
kellerwolke = "admin"
# Live mitlesen (RAD-129): hören und übersetzen über die Leitstelle
leitstelle = ["text", "hoeren", "uebersetzen"]

[radio]
# Dienst der App in compose.pi.yml (dort läuft die Sicherung) und die Dateien relativ zum Ordner der App: Daten bleiben
# seit dem Umzug in data/ (kein zweiter Umzug), das Gerüst des Appkerns hält seine in data/appkern
app = "radiohub"
datenbank = "data/radiohub.db"
geruest = "data/appkern/radiohub.sqlite"
einrichtungscode = "data/appkern/einrichtungscode"
# Ordner vor dem Umzug nach Entscheidung 21 (docs/umbau/PLAN.md): liegt RadioHub noch dort, bricht das Ausrollen ab und
# verweist auf tools/umzug-mnt-data.sh
umzug_von = "/home/pi/RadioHub"
