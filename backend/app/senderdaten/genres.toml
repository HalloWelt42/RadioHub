# Genres der Sender: aus dem Tag-Chaos des Senderverzeichnisses (11.429 Schreibweisen in der Sicherung vom 16.11.2026)
# wird eine gepflegte Liste. Ein Tag wird erst gesäubert (klein, ohne Rand, ohne "#" vorn), dann gilt in dieser
# Reihenfolge:
#   1. verwerfen: Rauschen (Wörter ohne Aussage wie "radio" oder "fm") und Frequenzen fallen weg, auch aus den Tags.
#   2. genres: eine bekannte Schreibweise ergibt ihr Genre.
#   3. muster: reguläre Ausdrücke für Reihen wie die Jahrzehnte ("80s", "80's", "1980s", "80er").
# Was sonst bleibt, ist ein Tag ohne Genre (für Suche und Tag-Regeln). Wer hier etwas ändert, hebt FASSUNG in
# senderdaten/__init__.py, damit der Bestand beim nächsten Start neu aufbereitet wird.

