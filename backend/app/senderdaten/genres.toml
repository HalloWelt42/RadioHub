# Reihen als Ausdrücke (Python re, ganzer Tag)
[[muster]]
ausdruck = "^(19)?50(s|'s|er)?$|^fifties$"
genre = "50er"

[[muster]]
ausdruck = "^(19)?60(s|'s|er)?$|^sixties$"
genre = "60er"

[[muster]]
ausdruck = "^(19)?70(s|'s|er)?$|^seventies$"
genre = "70er"

[[muster]]
ausdruck = "^(19)?80(s|'s|er)?$|^eighties$|^(the )?best of 80'?s$"
genre = "80er"

[[muster]]
ausdruck = "^(19)?90(s|'s|er)?$|^nineties$"
genre = "90er"

[[muster]]
