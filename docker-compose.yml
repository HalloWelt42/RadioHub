# RadioHub auf einem anderen Rechner (auf dem Pi gilt compose.pi.yml, ausgerollt mit tools/ausrollen.sh):
#
#   docker compose up -d --build
#
# Vorher ein Zertifikat für den Rechner als zertifikate/radiohub.pem und zertifikate/radiohub-schluessel.pem (etwa mit
# mkcert, siehe tools/zertifikat.sh), dazu rootCA.pem der Hausstelle in zertifikate/, und ./data sowie ./sicherungen für
# den Nutzer 1000 (sudo chown -R 1000:1000 data sicherungen). Erreichbar ist nur der Vorschaltdienst:
# https://<Rechner>:9093. Die App spricht nur im Netz der Container.
# Daten:    ./data   (Datenbank, Cache, Zwischenstände, das Gerüst in data/appkern; Aufnahmen und Folgen liegen in der
#                     Kellerwolke)
#
# Einstellungen in .env neben dieser Datei (Modus 600); alle lassen sich auch in der App unter Einstellungen setzen:
#   RADIOHUB_KELLERWOLKE_ADRESSE    Adresse der Kellerwolke
#   RADIOHUB_KELLERWOLKE_SCHLUESSEL App-Schlüssel der Kellerwolke (oder wie früher der Pfad einer Datei mit ihm; ohne
#                                   Angabe gilt data/kellerwolke.schluessel, wenn es sie gibt)
#   RADIOHUB_KELLERWOLKE_WURZEL     Wurzelordner (Vorgabe Apps/RadioHub)
#   RADIOHUB_ORTSSUCHE_ADRESSE      Kartensuche für den Ort der Sonnenzeiten (OSM lokal), etwa http://<rechner>:8120
#   RADIOHUB_VERTONUNG_ADRESSE      Vertonung für die Bausteine der Zeitansage, etwa https://<rechner>:8641
#   RADIOHUB_ZEITSTIMME             Kennung der Zeit-Stimme der Vertonung (dort für RadioHub freigeben)
#   RADIOHUB_ERLAUBTE_URSPRUENGE    nur, wenn eine fremde Seite die Schnittstelle nutzen soll (JSON-Liste, nie *)

services:
  radiohub:
    build: .
    container_name: radiohub
    restart: unless-stopped
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      RADIOHUB_DATEN: /data
      RADIOHUB_SICHERUNGEN: /sicherungen
      RADIOHUB_CA_DATEI: /zertifikate/rootCA.pem
      RADIOHUB_EINRICHTUNGSCODE_DATEI: /data/appkern/einrichtungscode
      RADIOHUB_EINRICHTUNGSCODE_ORT: data/appkern/einrichtungscode im Ordner der App
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
      - ./sicherungen:/sicherungen
      - ./zertifikate:/zertifikate:ro
    healthcheck:
      # Python statt curl: curl ist im Abbild nicht enthalten
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # HTTPS vor der App (Zertifikat in ./zertifikate, siehe tools/zertifikat.sh)
  vorne:
    image: caddy:2.11.7-alpine
    container_name: radiohub-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
    depends_on:
      - radiohub
