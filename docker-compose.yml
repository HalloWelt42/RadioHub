# RadioHub auf einem anderen Rechner (auf dem Pi gilt compose.pi.yml, ausgerollt mit tools/ausrollen.sh):
#
#   docker compose up -d --build
#
# Vorher ein Zertifikat für den Rechner als zertifikate/radiohub.pem und zertifikate/radiohub-schluessel.pem (etwa mit
# mkcert, siehe tools/zertifikat.sh) und ./data für den Nutzer 1000 (sudo chown -R 1000:1000 data). Erreichbar ist nur
# der Vorschaltdienst: https://<Rechner>:9093. Backend und Oberfläche (nginx) sprechen nur im Netz der Container.
# Daten:    ./data   (Datenbank, Cache, Zwischenstände; Aufnahmen und Podcast-Folgen liegen in der Kellerwolke)
#
# Kellerwolke und weitere Einstellungen in .env neben dieser Datei (Modus 600, siehe README):
#   RADIOHUB_KELLERWOLKE_ADRESSE    Adresse der Kellerwolke
#   RADIOHUB_KELLERWOLKE_SCHLUESSEL Schlüsseldatei im Container (Vorgabe /data/kellerwolke.schluessel)
#   RADIOHUB_KELLERWOLKE_WURZEL     Wurzelordner (Vorgabe Apps/RadioHub)
#   RADIOHUB_KELLERWOLKE_CA         Zertifikatsstelle im Container, etwa /zertifikate/rootCA.pem
#   RADIOHUB_ORTSSUCHE_ADRESSE      Kartensuche für den Ort der Sonnenzeiten (OSM lokal), etwa http://<rechner>:8120
#   RADIOHUB_VERTONUNG_ADRESSE      Vertonung für die Bausteine der Zeitansage, etwa https://<rechner>:8641
#   RADIOHUB_ZEITSTIMME             Kennung der Zeit-Stimme der Vertonung (dort für RadioHub freigeben)
#   ALLOWED_ORIGINS                 nur, wenn eine fremde Seite die Schnittstelle nutzen soll (durch Komma getrennt, nie *)

services:
  radiohub-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radiohub-backend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    expose:
      - "8000"
    volumes:
      - ./data:/data
      - ./zertifikate:/zertifikate:ro
    environment:
      - DATA_PATH=/data
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - TZ=Europe/Berlin
      - RADIOHUB_KELLERWOLKE_ADRESSE=${RADIOHUB_KELLERWOLKE_ADRESSE:-}
      - RADIOHUB_KELLERWOLKE_SCHLUESSEL=${RADIOHUB_KELLERWOLKE_SCHLUESSEL:-/data/kellerwolke.schluessel}
      - RADIOHUB_KELLERWOLKE_WURZEL=${RADIOHUB_KELLERWOLKE_WURZEL:-Apps/RadioHub}
      - RADIOHUB_KELLERWOLKE_CA=${RADIOHUB_KELLERWOLKE_CA:-}
      - RADIOHUB_ORTSSUCHE_ADRESSE=${RADIOHUB_ORTSSUCHE_ADRESSE:-}
      - RADIOHUB_VERTONUNG_ADRESSE=${RADIOHUB_VERTONUNG_ADRESSE:-}
      - RADIOHUB_ZEITSTIMME=${RADIOHUB_ZEITSTIMME:-}
      - RADIOHUB_ZEITSTIMME_TEMPO=${RADIOHUB_ZEITSTIMME_TEMPO:-1.0}
    healthcheck:
      # Python statt curl: curl ist im Abbild nicht enthalten
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  radiohub-frontend:
    build:
      context: .
      dockerfile: radiohub-frontend/Dockerfile
    container_name: radiohub-frontend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    expose:
      - "8080"
    environment:
      - TZ=Europe/Berlin
    depends_on:
      - radiohub-backend

  # HTTPS vor der Oberfläche (Zertifikat in ./zertifikate, siehe tools/zertifikat.sh)
  vorne:
    image: caddy:2.11.7-alpine
    container_name: radiohub-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
    depends_on:
      - radiohub-frontend
