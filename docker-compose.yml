# RadioHub - Top-Level Compose
#
# Ein-Befehl-Installation auf Pi und Mac:
#   docker compose up -d
#
# Frontend: http://localhost:9092, mit HTTPS (Telefon, Web-App) https://<rechner>:9093 über radiohub-vorne
# Backend:  http://localhost:9091  (API direkt; im Frontend per Reverse-Proxy unter /api)
# Daten:    ./data   (Datenbank, Cache, Zwischenstände; Aufnahmen und Podcast-Folgen liegen in der Kellerwolke)
#
# Kellerwolke (Einstellungen in .env neben dieser Datei, siehe README):
#   RADIOHUB_KELLERWOLKE_ADRESSE    Adresse der Kellerwolke
#   RADIOHUB_KELLERWOLKE_SCHLUESSEL Schlüsseldatei im Container (Vorgabe /data/kellerwolke.schluessel)
#   RADIOHUB_KELLERWOLKE_WURZEL     Wurzelordner (Vorgabe Apps/RadioHub)
#   RADIOHUB_KELLERWOLKE_CA         Zertifikatsstelle im Container, etwa /zertifikate/rootCA.pem
#   RADIOHUB_ORTSSUCHE_ADRESSE      Kartensuche für den Ort der Sonnenzeiten (OSM lokal), etwa http://<pi>:8120

services:
  radiohub-backend:
    build: ./radiohub-backend
    container_name: radiohub-backend
    restart: unless-stopped
    ports:
      - "9091:8000"
    volumes:
      - ./data:/data
      - ./zertifikate:/zertifikate:ro
    environment:
      - DATA_PATH=/data
      - ALLOWED_ORIGINS=*
      - TZ=Europe/Berlin
      - RADIOHUB_KELLERWOLKE_ADRESSE=${RADIOHUB_KELLERWOLKE_ADRESSE:-}
      - RADIOHUB_KELLERWOLKE_SCHLUESSEL=${RADIOHUB_KELLERWOLKE_SCHLUESSEL:-/data/kellerwolke.schluessel}
      - RADIOHUB_KELLERWOLKE_WURZEL=${RADIOHUB_KELLERWOLKE_WURZEL:-Apps/RadioHub}
      - RADIOHUB_KELLERWOLKE_CA=${RADIOHUB_KELLERWOLKE_CA:-}
      - RADIOHUB_ORTSSUCHE_ADRESSE=${RADIOHUB_ORTSSUCHE_ADRESSE:-}
    healthcheck:
      # Python statt curl: curl ist im Abbild nicht enthalten
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  radiohub-frontend:
    build: ./radiohub-frontend
    container_name: radiohub-frontend
    restart: unless-stopped
    ports:
      - "9092:80"
    environment:
      - TZ=Europe/Berlin
    depends_on:
      - radiohub-backend

  # HTTPS vor der Oberfläche (Zertifikat der Hausstelle in ./zertifikate, siehe tools/zertifikat.sh)
  radiohub-vorne:
    image: caddy:2.11.6-alpine
    container_name: radiohub-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
    depends_on:
      - radiohub-frontend
