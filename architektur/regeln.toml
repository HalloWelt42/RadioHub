# Harte Architekturregeln von RadioHub (RAD-5). Geprüft vom Appkern (python -m appkern.werkzeuge regeln) vor jedem
# Commit (tools/git-hooks/pre-commit) und beim Ausrollen (tools/ausrollen.sh). Eine Regel ändern oder umgehen geht nur
# mit Zustimmung des Nutzers: Ausnahmen stehen in architektur/ausnahmen.toml und gelten erst, wenn der Nutzer am Ticket
# "Ausnahme freigegeben: <Regel>" kommentiert hat. Begründungen, Bild der Schichten und die Regeln der kommenden Etappen:
# docs/ARCHITEKTUR.md. Aufgenommen ist nur, was der Code heute erfüllt; jede Etappe bringt ihre Regeln mit.

[freigabe]
pinnwand = "https://192.168.178.49:8420/api/v1"
schluessel = "~/.config/pinnwand/helfer.schluessel"
stichwort = "Ausnahme freigegeben"

# ----- Schichten -----------------------------------------------------------------------------------------------------

[[regel]]
kennung = "S1"
titel = "Schichten des Backends"
art = "schichten"
warum = "Die Schnittstelle nutzt Dienste, nie umgekehrt; die Ablage (Port und Adapter) kennt nur die Grundlagen, damit sie austauschbar bleibt (Kellerwolke, Speicher für Tests)."
dateien = ["backend/app/**"]
schichten = [
  { name = "schnittstelle", dateien = ["backend/app/routers/**", "backend/app/main.py"] },
  { name = "werkzeuge", dateien = ["backend/app/umzug/**", "backend/app/werkzeuge/**"] },
  { name = "dienste", dateien = ["backend/app/services/**"] },
  { name = "ablage", dateien = ["backend/app/ablage/**"] },
  { name = "grundlagen", dateien = ["backend/app/config.py", "backend/app/database.py", "backend/app/storage.py", "backend/app/fassung.py", "backend/app/sender_merkmale.py"] },
]
erlaubt = { schnittstelle = ["dienste", "ablage", "grundlagen"], werkzeuge = ["dienste", "ablage", "grundlagen"], dienste = ["ablage", "grundlagen"], ablage = ["grundlagen"] }

[[regel]]
kennung = "S2"
titel = "Schichten der Oberfläche"
art = "schichten"
warum = "Logik, Zustand und Zugriff aufs Backend (src/lib) kennen keine Bausteine der Oberfläche; so bleiben sie testbar und für Rechner, Telefon und Webversion dieselben."
dateien = ["radiohub-frontend/src/**"]
schichten = [
  { name = "oberflaeche", dateien = ["radiohub-frontend/src/components/**", "radiohub-frontend/src/App.svelte", "radiohub-frontend/src/main.js"] },
  { name = "logik", dateien = ["radiohub-frontend/src/lib/**"] },
]
erlaubt = { oberflaeche = ["logik"] }

# ----- Allgemein -------------------------------------------------------------------------------------------------------

[[regel]]
kennung = "G1"
titel = "Keine Bibliotheken aus dem Netz"
art = "verboten"
warum = "Schriften, Symbole und Bibliotheken kommen über npm oder pip, nie über CDN-Links zur Laufzeit."
dateien = ["radiohub-frontend/src/**", "radiohub-frontend/index.html", "backend/app/**"]
muster = 'https?://(cdn|unpkg|cdnjs|fonts\.googleapis|fonts\.gstatic|use\.fontawesome)'

[[regel]]
kennung = "G2"
titel = "Keine Browser-Dialoge"
art = "verboten"
warum = "Rückfragen und Meldungen laufen über eigene Bausteine der App; alert, confirm und prompt blockieren, sehen fremd aus und lassen sich nicht gestalten."
dateien = ["radiohub-frontend/src/**"]
muster = '(^|[^.\w])(window\.)?(alert|confirm|prompt)\('

[[regel]]
kennung = "G3"
titel = "Keine feste Fassung im Code"
art = "verboten"
warum = "version.json ist die einzige Quelle der Fassung; Backend (backend/fassung.py) und Oberfläche (Vite define) lesen sie, nichts schreibt sie von Hand ab."
dateien = ["radiohub-frontend/src/**", "radiohub-frontend/*.js", "radiohub-frontend/package.json", "backend/app/**"]
muster = '''(?i)["']?version["']?\s*[=:]\s*["']v?\d+\.\d+\.\d+'''

[[regel]]
kennung = "G4"
titel = "Architektur, Plan, Fassung und Betrieb sind da"
art = "pflicht"
warum = "Erst das Design, dann der Bau; Entscheidungen und Regeln haben einen festen Ort."
dateien = ["docs/ARCHITEKTUR.md", "docs/umbau/PLAN.md", "architektur/regeln.toml", "version.json", "compose.pi.yml", "deploy/ausrollen.toml", "deploy/Caddyfile", "docs/handbuch.md", "einrichten.sh"]

# ----- Absichern (RAD-5) -----------------------------------------------------------------------------------------------

[[regel]]
kennung = "B1"
titel = "Durchleiter nur per Kennung"
art = "verboten"
warum = "Ein Durchleiter für beliebige Adressen öffnet das Heimnetz für jeden, der die App erreicht (SSRF). Die Oberfläche nennt nur Sender oder Folge, die Adresse kommt aus der Datenbank (services/durchleiter.py)."
dateien = ["radiohub-frontend/src/**", "backend/app/**"]
muster = '(/stream/proxy|getStreamProxyUrl|proxy\?url=)'

[[regel]]
kennung = "B2"
titel = "TLS-Prüfung bleibt an"
art = "verboten"
warum = "Ohne Prüfung des Zertifikats kann sich jeder im Weg als Sender, Kellerwolke oder Vertonung ausgeben."
dateien = ["backend/app/**"]
muster = '(verify\s*=\s*False|CERT_NONE|_create_unverified_context|check_hostname\s*=\s*False)'

[[regel]]
kennung = "B3"
titel = "Kein Abruf fremder Dienste aus der Oberfläche"
art = "verboten"
warum = "Die Oberfläche spricht nur mit dem eigenen Backend; neue Fassungen erkennt sie an der eigenen Startseite (lib/aktualisierung.svelte.js), nicht über GitHub."
dateien = ["radiohub-frontend/src/**"]
muster = '(raw\.githubusercontent\.com|api\.github\.com)'

[[regel]]
kennung = "B4"
titel = "Keine CORS-Freigabe für alle Ursprünge"
art = "verboten"
warum = "Die Oberfläche spricht /api über denselben Ursprung; eine Freigabe für alle ließe jede fremde Seite im Browser des Nutzers die Schnittstelle bedienen. Fremde Ursprünge nur ausdrücklich über ALLOWED_ORIGINS."
dateien = ["backend/app/**", "radiohub-frontend/nginx.conf", "radiohub-frontend/vite.config.js", "compose.pi.yml", "docker-compose.yml"]
muster = '''(allow_origins\s*=\s*\[\s*["']\*|ALLOWED_ORIGINS\s*[=:]\s*["']?\*|Access-Control-Allow-Origin\s+\*|cors:\s*true)'''

[[regel]]
kennung = "B5"
titel = "Backend und nginx nicht veröffentlicht"
art = "verboten"
warum = "Nach außen nur der Vorschaltdienst mit TLS; Backend (8000) und Oberfläche (8080) sprechen nur im Netz der Container (expose)."
dateien = ["compose.pi.yml", "docker-compose.yml"]
muster = '''^\s*-\s*["']?[\d.]*:?\d+:(8000|8080|80)["']?\s*$'''
