# Harte Architekturregeln von RadioHub (RAD-5). Geprüft vom Appkern (python -m appkern.werkzeuge regeln) vor jedem
# Commit (tools/git-hooks/pre-commit) und beim Ausrollen (tools/ausrollen.sh). Eine Regel ändern oder umgehen geht nur
# mit Zustimmung des Nutzers: Ausnahmen stehen in architektur/ausnahmen.toml und gelten erst, wenn der Nutzer am Ticket
# "Ausnahme freigegeben: <Regel>" kommentiert hat. Begründungen, Bild der Schichten und die Regeln der kommenden Etappen:
# docs/ARCHITEKTUR.md. Aufgenommen ist nur, was der Code heute erfüllt; jede Etappe bringt ihre Regeln mit.

[freigabe]
pinnwand = "https://192.168.178.49:8420/api/v1"
schluessel = "~/.config/pinnwand/helfer.schluessel"
stichwort = "Ausnahme freigegeben"

# ----- Schichten -----------------------------------------------------------------------------------------------------

[[regel]]
kennung = "S1"
titel = "Schichten des Backends"
art = "schichten"
warum = "Die Schnittstelle nutzt Dienste, nie umgekehrt; die Ablage (Port und Adapter) kennt nur die Grundlagen, damit sie austauschbar bleibt (Kellerwolke, Speicher für Tests). Der Senderdaten-Baustein bindet nichts aus der App ein, damit ihn auch das Skript der statischen Webversion nutzt (RAD-7)."
dateien = ["backend/app/**"]
schichten = [
  { name = "schnittstelle", dateien = ["backend/app/routers/**", "backend/app/main.py", "backend/app/betrieb.py"] },
  { name = "werkzeuge", dateien = ["backend/app/umzug/**", "backend/app/werkzeuge/**"] },
  { name = "dienste", dateien = ["backend/app/services/**"] },
  { name = "ablage", dateien = ["backend/app/ablage/**"] },
  { name = "grundlagen", dateien = ["backend/app/config.py", "backend/app/database.py", "backend/app/storage.py", "backend/app/fassung.py", "backend/app/einstellungen.py", "backend/app/uebergang.py", "backend/app/ort.py"] },
  { name = "senderdaten", dateien = ["backend/app/senderdaten/**"] },
]
erlaubt = { schnittstelle = ["dienste", "ablage", "grundlagen", "senderdaten"], werkzeuge = ["dienste", "ablage", "grundlagen", "senderdaten"], dienste = ["ablage", "grundlagen", "senderdaten"], ablage = ["grundlagen"] }

[[regel]]
kennung = "S2"
titel = "Schichten der Oberfläche"
art = "schichten"
warum = "Logik, Zustand und Zugriff aufs Backend (src/lib) kennen keine Bausteine der Oberfläche; so bleiben sie testbar und für Rechner, Telefon und Webversion dieselben."
dateien = ["frontend/src/**"]
schichten = [
  { name = "oberflaeche", dateien = ["frontend/src/schale/**", "frontend/src/components/**", "frontend/src/App.svelte", "frontend/src/main.ts"] },
  { name = "logik", dateien = ["frontend/src/lib/**"] },
]
erlaubt = { oberflaeche = ["logik"] }

# ----- Allgemein -------------------------------------------------------------------------------------------------------

[[regel]]
kennung = "G1"
titel = "Keine Bibliotheken aus dem Netz"
art = "verboten"
warum = "Schriften, Symbole und Bibliotheken kommen über npm oder pip, nie über CDN-Links zur Laufzeit."
dateien = ["frontend/src/**", "frontend/index.html", "backend/app/**"]
muster = 'https?://(cdn|unpkg|cdnjs|fonts\.googleapis|fonts\.gstatic|use\.fontawesome)'

[[regel]]
kennung = "G2"
titel = "Keine Browser-Dialoge"
art = "verboten"
warum = "Rückfragen und Meldungen laufen über eigene Bausteine der App; alert, confirm und prompt blockieren, sehen fremd aus und lassen sich nicht gestalten."
dateien = ["frontend/src/**"]
muster = '(^|[^.\w])(window\.)?(alert|confirm|prompt)\('

[[regel]]
kennung = "G3"
titel = "Keine feste Fassung im Code"
art = "verboten"
warum = "version.json ist die einzige Quelle der Fassung; Backend (backend/fassung.py) und Oberfläche (Vite define) lesen sie, nichts schreibt sie von Hand ab."
dateien = ["frontend/src/**", "frontend/*.js", "frontend/*.ts", "frontend/package.json", "backend/app/**"]
muster = '''(?i)["']?version["']?\s*[=:]\s*["']v?\d+\.\d+\.\d+'''

[[regel]]
kennung = "G4"
titel = "Architektur, Plan, Fassung und Betrieb sind da"
art = "pflicht"
warum = "Erst das Design, dann der Bau; Entscheidungen und Regeln haben einen festen Ort."
dateien = ["docs/ARCHITEKTUR.md", "docs/umbau/PLAN.md", "architektur/regeln.toml", "version.json", "compose.pi.yml", "deploy/ausrollen.toml", "deploy/Caddyfile", "docs/handbuch.md", "einrichten.sh"]

# ----- Appkern-Grundlage (RAD-6, Etappe 2) -----------------------------------------------------------------------------

[[regel]]
kennung = "P1"
titel = "Protokoll statt print"
art = "verboten"
warum = "Was der Server meldet, geht ins Log (logging, Logger radiohub.*) und Wichtiges zusätzlich ins Protokoll der App; print geht im Container an jeder Stufe vorbei und lässt sich nicht filtern. Ausgenommen sind die Befehle für die Kommandozeile, deren Ausgabe das Ergebnis ist."
dateien = ["backend/app/**"]
ausser = ["backend/app/umzug/__main__.py", "backend/app/werkzeuge/**"]
muster = '(^|[^.\w])print\('

[[regel]]
kennung = "K1"
titel = "Einstellungen aus einer Quelle"
art = "verboten"
warum = "Einstellungen kommen nur aus den Einstellungen des Appkerns (app/einstellungen.py: Datenbank, Umgebung RADIOHUB_*, Vorgabe); Orte des Datenordners nur aus app/ort.py, frühere Namen nur über app/uebergang.py. Ein os.environ irgendwo sonst wäre eine fünfte Quelle, die die Oberfläche nicht zeigt."
dateien = ["backend/app/**"]
ausser = ["backend/app/ort.py", "backend/app/uebergang.py"]
muster = '(os\.environ|os\.getenv|getenv\()'

[[regel]]
kennung = "D1"
titel = "Schema nur in Stufen"
art = "verboten"
warum = "Das Schema der Datenbank ändert sich nur über eine neue Stufe am Ende von database.STUFEN (Datenbank des Appkerns mit Stand je Baustein), nie über ALTER in try/except beim Start. Die Nachträge für ältere Bestände stehen allein in database.py."
dateien = ["backend/app/**"]
ausser = ["backend/app/database.py"]
muster = '(?i)alter\s+table'

# ----- Absichern (RAD-5) -----------------------------------------------------------------------------------------------

[[regel]]
kennung = "B1"
titel = "Durchleiter nur per Kennung"
art = "verboten"
warum = "Ein Durchleiter für beliebige Adressen öffnet das Heimnetz für jeden, der die App erreicht (SSRF). Die Oberfläche nennt nur Sender oder Folge, die Adresse kommt aus der Datenbank (services/durchleiter.py)."
dateien = ["frontend/src/**", "backend/app/**"]
muster = '(/stream/proxy|getStreamProxyUrl|proxy\?url=)'

[[regel]]
kennung = "B2"
titel = "TLS-Prüfung bleibt an"
art = "verboten"
warum = "Ohne Prüfung des Zertifikats kann sich jeder im Weg als Sender, Kellerwolke oder Vertonung ausgeben."
dateien = ["backend/app/**"]
muster = '(verify\s*=\s*False|CERT_NONE|_create_unverified_context|check_hostname\s*=\s*False)'

[[regel]]
kennung = "B3"
titel = "Kein Abruf fremder Dienste aus der Oberfläche"
art = "verboten"
warum = "Die Oberfläche spricht nur mit dem eigenen Backend; neue Fassungen erkennt sie an der eigenen Startseite (lib/aktualisierung.svelte.js), nicht über GitHub."
dateien = ["frontend/src/**"]
muster = '(raw\.githubusercontent\.com|api\.github\.com)'

[[regel]]
kennung = "B4"
titel = "Keine CORS-Freigabe für alle Ursprünge"
art = "verboten"
warum = "Die Oberfläche spricht /api über denselben Ursprung; eine Freigabe für alle ließe jede fremde Seite im Browser des Nutzers die Schnittstelle bedienen. Fremde Ursprünge nur ausdrücklich über die Einstellung erlaubte_urspruenge (RADIOHUB_ERLAUBTE_URSPRUENGE, früher ALLOWED_ORIGINS)."
dateien = ["backend/app/**", "deploy/Caddyfile", "frontend/vite.config.ts", "compose.pi.yml", "docker-compose.yml"]
muster = '''(allow_origins\s*=\s*\[\s*["']\*|ALLOWED_ORIGINS\s*[=:]\s*["']?\*|Access-Control-Allow-Origin\s+\*|cors:\s*true)'''

[[regel]]
kennung = "B5"
titel = "Die App nicht veröffentlicht"
art = "verboten"
warum = "Nach außen nur der Vorschaltdienst mit TLS; die App (8000, liefert auch die Oberfläche aus) spricht nur im Netz der Container (expose)."
dateien = ["compose.pi.yml", "docker-compose.yml"]
muster = '''^\s*-\s*["']?[\d.]*:?\d+:(8000|8080|80)["']?\s*$'''

# ----- Filterung (RAD-7, Etappe 3) -------------------------------------------------------------------------------------

[[regel]]
kennung = "D2"
titel = "Router ohne SQL"
art = "verboten"
warum = "Die Schnittstelle prüft Eingaben und ruft Dienste; Abfragen stehen allein in der Datenschicht (services/senderquelle), damit es für Sichtbarkeit und Sender nur eine Wahrheit gibt und jede Abfrage an einer Stelle auf Indizes geprüft wird. Gilt für die Router der Senderquelle und die alten Wege, die schon darauf umgestellt sind; die übrigen Router folgen mit ihrem Neubau."
dateien = ["backend/app/routers/radio.py", "backend/app/routers/filters.py", "backend/app/routers/blocklist.py"]
muster = '(db_session|get_db\(|\.execute\(|\b(SELECT|INSERT|UPDATE|DELETE)\b[^"\n]*\b(FROM|INTO|SET)\b)'
