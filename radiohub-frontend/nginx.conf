# Oberfläche und Weg zum Backend, nur im Netz der Container (vor ihr der Vorschaltdienst, deploy/Caddyfile). Läuft ohne
# root (nginx-unprivileged) auf 8080. Keine CORS-Köpfe: die Oberfläche spricht /api über denselben Ursprung.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-Proxy ans Backend (Service-Name aus docker-compose)
    location ^~ /api/ {
        proxy_pass http://radiohub-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://radiohub-backend:8000/health;
    }

    location /docs {
        proxy_pass http://radiohub-backend:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://radiohub-backend:8000/openapi.json;
    }

    # Echte Pfade der App: unbekannte Pfade liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nie aus dem Zwischenspeicher: an ihr erkennt die App eine neue Fassung
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Gebaute Dateien: was fehlt, ist 404 und nie index.html (sonst bekäme ein alter Zwischenspeicher HTML als Skript)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifest für Startbildschirm/PWA: nginx kennt .webmanifest nicht und liefert sonst
    # application/octet-stream. Eigener Ort statt types-Block, damit die übrige Typtabelle bleibt.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    # Übrige Dateien mit Endung ebenso: vorhanden oder 404
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
