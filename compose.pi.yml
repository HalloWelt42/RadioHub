# RadioHub auf dem Pi (tools/ausrollen.sh: docker compose -f compose.pi.yml), ein Container wie in der Vorlage des
# Appkerns: das Backend liefert die Oberfläche selbst aus. Vorne Caddy mit dem Zertifikat der Hausstelle (das Ausrollen
# stellt es aus) auf Port 9093, dahinter die App nur im Netz der Container (expose) und nicht als root. Im Heimnetz nur
# TLS (HELF-169, Handbuch: Grundlage Pi): die frühere Adresse auf 9092 leitet der Vorbau des Pi auf 9093 um,
# radio.<Rufname>.lan reicht er an 9093 weiter.
# Daten in ./data (radiohub.db, Cache, storage.json; das Gerüst des Appkerns in ./data/appkern), Sicherungen in
# ./sicherungen, Zertifikate in ./zertifikate. Einstellungen des Hauses in ./.env (Modus 600, nicht im Repo): die
# Werte RADIOHUB_* gelten wie bisher, dazu setzt das Ausrollen den Zugang zur Kellerwolke fest
# (RADIOHUB_FEST_KELLERWOLKE_ADRESSE und _SCHLUESSEL, [zugaenge] in deploy/ausrollen.toml).
services:
  radiohub:
    build: .
    image: radiohub:aktuell
    container_name: radiohub
    restart: unless-stopped
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    expose:
      - "8000"
    networks:
      default: {}
      # die Ortssuche (Sonnenzeiten) fragt OSMLocal über das gemeinsame Netz der Apps auf dem Pi
      haus: {}
    env_file:
      - path: .env
        required: false
    environment:
      RADIOHUB_DATEN: /data
      RADIOHUB_SICHERUNGEN: /sicherungen
      RADIOHUB_CA_DATEI: /zertifikate/rootCA.pem
      # erste Einrichtung von anderswo (Lehre 34): der Code liegt im eingebundenen Datenordner, gefunden auf dem Pi
      RADIOHUB_EINRICHTUNGSCODE_DATEI: /data/appkern/einrichtungscode
      # wo der Code für den Menschen zu finden ist; das Ausrollen setzt rechner:ordner aus der privaten Wahrheit
      RADIOHUB_EINRICHTUNGSCODE_ORT: ${EINRICHTUNGSCODE_ORT:-data/appkern/einrichtungscode im Ordner der App}
      # OSMLocal heißt im Netz haus osmlocal (Alias in seiner Compose-Datei auf dem Pi)
      RADIOHUB_ORTSSUCHE_ADRESSE: http://osmlocal:8120
      TZ: Europe/Berlin
      # Stücke des Zeitversatzes im Arbeitsspeicher statt auf dem Datenträger (RAD-92): jede Sekunde ein Stück, bis
      # zu 8 h; die Größe des Bereichs über RADIOHUB_PUFFER_RAM in .env (Vorgabe für 8 h bei 320 kbit/s)
      RADIOHUB_HLS_PUFFER_ORDNER: /puffer/hls
    volumes:
      - ./data:/data
      # Sicherungen der Datenbanken nach der Regel des Appkerns: regelmäßig von der App, vor dem Neustart vom Ausrollen
      - ./sicherungen:/sicherungen
      - ./zertifikate:/zertifikate:ro
    tmpfs:
      - /puffer:size=${RADIOHUB_PUFFER_RAM:-1200m},uid=1000,gid=1000,mode=0750
    healthcheck:
      # Python statt curl: curl ist im Abbild nicht enthalten
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # HTTPS vor der App mit dem Blattzertifikat der Hausstelle (zertifikate/radiohub.pem, vom Ausrollen)
  vorne:
    image: caddy:2.11.7-alpine
    container_name: radiohub-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
    depends_on:
      - radiohub

networks:
  haus:
    external: true
    name: haus
